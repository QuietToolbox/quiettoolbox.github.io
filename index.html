<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="QuietToolbox — small tools for research and everyday work.">
<link rel="icon" type="image/png" href="assets/quiettoolbox-avatar.png">
<title>QuietToolbox</title>
<script>
try{const theme=localStorage.getItem('quiettoolbox-theme');document.documentElement.dataset.theme=theme==='dark'||theme==='light'?theme:(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');}catch{document.documentElement.dataset.theme='light';}
</script>
<style>
:root{color-scheme:light;--bg:#f6f7f9;--ink:#242629;--muted:#777c85;--control:#fff;--border:#e0e3e8}
:root[data-theme="dark"]{color-scheme:dark;--bg:#17191e;--ink:#f1f2f5;--muted:#a0a6b1;--control:#24272e;--border:#363a43}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;min-height:100svh}
header{display:flex;align-items:center;justify-content:space-between;gap:20px;max-width:1080px;margin:auto;padding:28px 32px}.brand{display:flex;align-items:center;gap:10px;font-size:17px;font-weight:650;letter-spacing:-.5px}.brand img{border-radius:7px;width:28px;height:28px}.preferences{display:flex;gap:8px}button{font:inherit;font-size:13px;padding:8px 12px;min-height:38px;background:var(--control);border:1px solid var(--border);border-radius:10px;color:var(--ink);cursor:pointer}button:hover{filter:brightness(.96)}button:focus-visible,a:focus-visible{outline:3px solid #739ee7;outline-offset:7px}
main{display:flex;align-items:center;justify-content:center;min-height:calc(100svh - 100px);padding:20px 24px 120px}.apps{display:grid;grid-template-columns:repeat(2,240px);gap:64px}.app{text-decoration:none;color:inherit;text-align:center;border-radius:22px;padding:20px 12px;display:flex;flex-direction:column;align-items:center}.icon{width:124px;height:124px;border-radius:28px;display:grid;place-items:center;box-shadow:0 12px 24px #00000012,inset 0 1px 1px #ffffff65;transition:transform .18s,box-shadow .18s}.app:hover .icon{transform:translateY(-5px);box-shadow:0 18px 30px #00000020}.app:active .icon{transform:scale(.97)}.icon svg{width:82px;height:82px}.guide{background:linear-gradient(145deg,#65b6ff,#3477e7)}.pico{background:linear-gradient(145deg,#6f9d88,#315846)}h1{font-size:19px;font-weight:600;margin:25px 0 9px;letter-spacing:-.4px}.app p{font-size:14px;line-height:1.65;color:var(--muted);margin:0;max-width:225px}
@media(max-width:600px){header{padding:22px 20px;gap:12px}.brand{font-size:15px}.brand img{width:24px;height:24px}.preferences{gap:6px}button{padding:8px;font-size:12px}.apps{grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;width:100%;max-width:400px}.app{padding:15px 0}.icon{width:104px;height:104px;border-radius:24px}.icon svg{width:70px;height:70px}h1{font-size:17px}.app p{font-size:13px;max-width:165px}main{padding-bottom:90px}}
@media(prefers-reduced-motion:reduce){.icon{transition:none}}

main{display:block;max-width:1080px;margin:0 auto;min-height:calc(100svh - 100px);padding:40px 32px 80px}
.apps{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:30px 24px;max-width:none;align-items:start}
.app{padding:16px 0}.icon{width:104px;height:104px;border-radius:24px}.icon svg{width:70px;height:70px}h1{font-size:16px;margin:18px 0 7px}.app p{font-size:12px;max-width:170px;line-height:1.7}
.placeholder{display:flex;justify-content:center;padding:16px 0;pointer-events:none}.placeholder span{display:block;width:104px;height:104px;border:1.5px dashed var(--border);border-radius:24px}
@media(max-width:600px){main{padding:24px 20px 60px}.apps{width:100%;max-width:none;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px 18px}.app p{max-width:160px}}
</style>
</head>
<body>
<header><div class="brand"><img src="assets/quiettoolbox-avatar.jpg" alt="">QuietToolbox</div><div class="preferences"><button id="language-toggle" type="button">English</button><button id="theme-toggle" type="button">夜间模式</button></div></header>
<main><div class="apps">
<a class="app" href="https://aiddls.github.io/">
<div class="icon guide" aria-hidden="true"><svg viewBox="0 0 80 80" fill="none"><rect x="18" y="10" width="44" height="60" rx="7" fill="white"/><path d="M29 27h22M29 36h22M29 45h13" stroke="#5596ec" stroke-width="4" stroke-linecap="round"/><path d="m43 55 5 5 10-12" stroke="#5596ec" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
<h1 data-i18n="guide">AI DDLs</h1><p data-i18n="guideDesc">查询期刊会议等级与投稿日期</p>
</a>
<a class="app" href="https://github.com/QuietToolbox/PicoEgoCapture">
<div class="icon pico" aria-hidden="true"><svg viewBox="0 0 80 80" fill="none"><path d="M12 31c1-9 7-14 16-14h24c9 0 15 5 16 14l3 18c1 8-4 14-12 14H49l-9-9-9 9H21c-8 0-13-6-12-14l3-18Z" fill="#fff"/><rect x="19" y="29" width="42" height="18" rx="9" fill="#54816b"/><path d="m32 34-5 4 5 4m16-8 5 4-5 4" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
<h1>PicoEgoCapture</h1><p data-i18n="picoDesc">PICO 第一视角采集源码</p>
</a>
<div class="placeholder" aria-hidden="true"><span></span></div><div class="placeholder" aria-hidden="true"><span></span></div><div class="placeholder" aria-hidden="true"><span></span></div>
<div class="placeholder" aria-hidden="true"><span></span></div><div class="placeholder" aria-hidden="true"><span></span></div><div class="placeholder" aria-hidden="true"><span></span></div><div class="placeholder" aria-hidden="true"><span></span></div><div class="placeholder" aria-hidden="true"><span></span></div><div class="placeholder" aria-hidden="true"><span></span></div><div class="placeholder" aria-hidden="true"><span></span></div><div class="placeholder" aria-hidden="true"><span></span></div><div class="placeholder" aria-hidden="true"><span></span></div><div class="placeholder" aria-hidden="true"><span></span></div>
</div></main>
<script>
const text={zh:{guide:'AI DDLs',guideDesc:'查询期刊会议等级与投稿日期',picoDesc:'PICO 第一视角采集源码'},en:{guide:'AI DDLs',guideDesc:'Find venue rankings and submission deadlines',picoDesc:'Explore the PICO egocentric data collection source'}};
let language='en';try{const saved=localStorage.getItem('quiettoolbox-language');language=saved==='zh'||saved==='en'?saved:(navigator.language.toLowerCase().startsWith('zh')?'zh':'en');}catch{}
function save(key,value){try{localStorage.setItem(key,value);}catch{}}
function render(){const zh=language==='zh',dark=document.documentElement.dataset.theme==='dark';document.documentElement.lang=zh?'zh-CN':'en';document.querySelectorAll('[data-i18n]').forEach(el=>el.textContent=text[language][el.dataset.i18n]);document.getElementById('language-toggle').textContent=zh?'English':'中文';const theme=document.getElementById('theme-toggle');theme.textContent=zh?(dark?'☀ 日间模式':'☾ 夜间模式'):(dark?'☀ Light':'☾ Dark');theme.setAttribute('aria-label',zh?(dark?'切换为日间模式':'切换为夜间模式'):(dark?'Switch to light mode':'Switch to dark mode'));}
document.getElementById('language-toggle').addEventListener('click',()=>{language=language==='zh'?'en':'zh';save('quiettoolbox-language',language);render();});
document.getElementById('theme-toggle').addEventListener('click',()=>{const theme=document.documentElement.dataset.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=theme;save('quiettoolbox-theme',theme);render();});render();
</script>
</body></html>
